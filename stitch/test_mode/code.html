<body class="min-h-screen flex flex-col">
<!-- TopAppBar Section -->
<header class="w-full top-0 sticky bg-[#f5f6f7] dark:bg-slate-900 flex items-center justify-between px-6 py-4 w-full z-50">
<div class="flex items-center gap-4">

<span class="material-symbols-outlined text-[#5D5FEF] dark:text-[#9396ff] text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold text-xl tracking-tight text-[#2c2f30] dark:text-white">Priprema – Politehnika</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden">

</div>
</div>
</header>
<main class="flex-1 max-w-2xl mx-auto w-full px-6 py-8 flex flex-col gap-10">
<!-- Progress Indicator -->
<section class="flex flex-col gap-3">
<div class="flex justify-between items-end">
<span class="font-headline font-extrabold text-on-surface text-lg">Pitanje 5 <span class="text-on-surface-variant font-medium text-sm">od 30</span></span>
<span class="bg-primary-container/20 text-primary font-bold px-3 py-1 rounded-full text-xs tracking-wider">MATEMATIKA</span>
</div>
<!-- Signature Progress Bar -->
<div class="h-6 w-full bg-surface-container-highest rounded-full overflow-hidden p-1 shadow-inner">
<div class="h-full bg-gradient-to-r from-primary to-primary-container rounded-full" style="width: 16.6%;"></div>
</div>
</section>
<!-- Question Card -->
<article class="bg-surface-container-lowest rounded-lg p-8 shadow-[0_8px_24px_rgba(44,47,48,0.04)] border border-outline-variant/5">
<h2 class="font-headline font-bold text-on-surface text-xl md:text-2xl leading-relaxed">
                Koja je vrednost x u jednačini 2x + 15 = 45 ukoliko se posmatra u skupu prirodnih brojeva?
            </h2>
</article>
<!-- Answer Options -->
<section class="grid grid-cols-1 gap-4">
<!-- Option A -->
<button class="min-h-[5.5rem] bg-surface-container-lowest p-5 rounded-lg flex items-center gap-6 text-left transition-all active:scale-[0.98] border border-outline-variant/15 hover:bg-surface-container-low group">
<span class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center font-bold text-on-surface group-hover:bg-primary-container/20 group-hover:text-primary transition-colors">A</span>
<span class="font-body text-on-surface font-medium text-lg">x = 10</span>
</button>
<!-- Option B (Selected State) -->
<button class="min-h-[5.5rem] bg-primary-container/10 p-5 rounded-lg flex items-center gap-6 text-left transition-all active:scale-[0.98] border-2 border-primary shadow-sm relative overflow-hidden">
<span class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold">B</span>
<span class="font-body text-on-surface font-bold text-lg">x = 15</span>
<div class="absolute right-6 top-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Option V -->
<button class="min-h-[5.5rem] bg-surface-container-lowest p-5 rounded-lg flex items-center gap-6 text-left transition-all active:scale-[0.98] border border-outline-variant/15 hover:bg-surface-container-low group">
<span class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center font-bold text-on-surface group-hover:bg-primary-container/20 group-hover:text-primary transition-colors">V</span>
<span class="font-body text-on-surface font-medium text-lg">x = 30</span>
</button>
<!-- Option G -->
<button class="min-h-[5.5rem] bg-surface-container-lowest p-5 rounded-lg flex items-center gap-6 text-left transition-all active:scale-[0.98] border border-outline-variant/15 hover:bg-surface-container-low group">
<span class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center font-bold text-on-surface group-hover:bg-primary-container/20 group-hover:text-primary transition-colors">G</span>
<span class="font-body text-on-surface font-medium text-lg">x = 20</span>
</button>

<div class="h-24"></div>
